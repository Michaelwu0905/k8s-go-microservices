apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
  namespace: ride-sharing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-service
  template:
    metadata:
      labels:
        app: driver-service
    spec:
      containers:
        - name: driver-service
          image: ride-sharing/driver-service
          ports:
            - containerPort: 8082
            - containerPort: 9092
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: ride-sharing
spec:
  selector:
    app: driver-service
  ports:
    - port: 8082
      name: http
      targetPort: 8082
    - port: 9092
      name: grpc
      targetPort: 9092
  type: ClusterIP

