# Local development credentials only; use managed secrets outside this cluster.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ride-sharing
type: Opaque
stringData:
  POSTGRES_USER: ride_sharing
  POSTGRES_PASSWORD: ride-sharing-local-dev
  POSTGRES_DB: ride_sharing
  DATABASE_URL: postgres://ride_sharing:ride-sharing-local-dev@postgres.ride-sharing.svc.cluster.local:5432/ride_sharing?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ride-sharing
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ride-sharing
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # Mirror of the official postgres:16 image; seed it as described in README.
          image: 192.168.64.4:5000/postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
