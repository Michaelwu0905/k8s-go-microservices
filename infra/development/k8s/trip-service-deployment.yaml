apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: ride-sharing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      containers:
        - name: trip-service
          image: ride-sharing/trip-service
          env:
            - name: INTERNAL_RPC_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-service-auth
                  key: INTERNAL_RPC_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          ports:
            - containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: 9093
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: ride-sharing
spec:
  selector:
    app: trip-service
  ports:
    - port: 9093
      name: grpc
      targetPort: 9093
  type: ClusterIP

