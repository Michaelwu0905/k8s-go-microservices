apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ride-sharing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ride-sharing/api-gateway
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: INTERNAL_RPC_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-service-auth
                  key: INTERNAL_RPC_KEY
            - name: ALLOWED_ORIGINS
              value: "http://localhost:3000,http://127.0.0.1:3000"
            - name: DRIVER_SERVICE_URL
              value: "driver-service:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ride-sharing
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: api-gateway
