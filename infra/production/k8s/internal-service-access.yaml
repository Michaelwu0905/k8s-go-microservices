apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services-from-gateway
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [trip-service, driver-service]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
