syntax = "proto3";

package trip;

option go_package = "shared/proto/trip;trip";

service TripService {
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
  rpc AcceptTrip(AcceptTripRequest) returns (AcceptTripResponse);
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse);
  rpc UpdateTripStatus(UpdateTripStatusRequest) returns (GetTripResponse);
  rpc WatchTrips(WatchTripsRequest) returns (stream ListTripsResponse);
}

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  TRIP_STATUS_PENDING = 1;
  TRIP_STATUS_ACCEPTED = 2;
  TRIP_STATUS_ARRIVED = 3;
  TRIP_STATUS_IN_TRIP = 4;
  TRIP_STATUS_COMPLETED = 5;
  TRIP_STATUS_CANCELLED = 6;
}

message CreateTripRequest {
  Coordinate start_location = 1;
  Coordinate end_location = 2;
  string rider_id = 3;
}

message Coordinate {
  float latitude = 1;
  float longitude = 2;
}

message Geometry {
  repeated Coordinate coordinates = 1;
}

message Route {
  repeated Geometry geometry = 1;
  float distance = 2;
  float duration = 3;
}

message CreateTripResponse {
  string trip_id = 1;
  Route route = 2;
  TripStatus status = 3;
  Trip trip = 4;
}

message AcceptTripRequest {
  string trip_id = 1;
  string driver_id = 2;
}

message AcceptTripResponse {
  string trip_id = 1;
  TripStatus status = 2;
  Trip trip = 3;
}

message GetTripRequest {
  string trip_id = 1;
}

message GetTripResponse {
  string trip_id = 1;
  TripStatus status = 2;
  Trip trip = 3;
}

message Trip {
  string trip_id = 1;
  TripStatus status = 2;
  Route route = 3;
  Coordinate pickup = 4;
  Coordinate destination = 5;
  string driver_id = 6;
  string rider_id = 7;
  string created_at = 8;
  string updated_at = 9;
  int64 version = 10;
}

message ListTripsRequest {
  string driver_id = 1;
  string rider_id = 2;
}

message ListTripsResponse {
  repeated Trip trips = 1;
}

message UpdateTripStatusRequest {
  string trip_id = 1;
  TripStatus status = 2;
  string driver_id = 3;
  string rider_id = 4;
}

message WatchTripsRequest {
  string trip_id = 1;
  string driver_id = 2;
  string rider_id = 3;
}
